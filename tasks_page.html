    <summary>Select Filter</summary>
    <ul>
      <li><label><input type="checkbox"> Recommended</label></li>
      <li><label><input type="checkbox"> Due soon</label></li>
      <li><label><input type="checkbox"> Completed</label></li>
    </ul>
  </details>

  <!-- Section headers -->
  <div class="band" style="top:291px;height:98px"></div>
  <h2 class="title" style="left:41px;top:325px">Tasks</h2>

    <svg class="add-icon" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1fe21f"/><path d="M17 8v18M8 17h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    <span>Add New<br>Category</span>
  </button>

  <div class="divider-v" style="left:720px;top:290px;height:734px"></div>

  <!-- Saved tasks are inserted here by app.js. -->
  <div id="task-list" class="task-list"></div>
