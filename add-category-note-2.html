<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Category (Notes, filled)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">

  <header class="top-nav">
    <nav aria-label="Main">
      <a class="nav-tile nav-tile--home" href="index.html">
        <svg class="nav-icon nav-icon--home" viewBox="0 0 116 67" aria-hidden="true"><path d="M58 2 2 40h12v26h30V46h28v20h30V40h12z"/></svg>
        <span>Home</span>
      </a>
      <a class="nav-tile nav-tile--tasks" href="tasks.html">
        <svg class="nav-icon nav-icon--tasks" viewBox="0 0 62 88" aria-hidden="true"><rect x="24" width="14" height="58" rx="5"/><circle cx="31" cy="76" r="8"/></svg>
        <span>Tasks</span>
      </a>
      <a class="nav-tile nav-tile--notes is-active" href="notes.html" aria-current="page">
        <svg class="nav-icon nav-icon--notes" viewBox="0 0 61 61" aria-hidden="true"><rect x="8" y="8" width="40" height="50" rx="3"/><path d="M14 2v12M24 2v12M34 2v12M15 24h21M15 34h17M40 40l14-14 4 4-14 14-6 2z"/></svg>
        <span>Notes</span>
      </a>
    </nav>
    <div class="profile">
      <svg class="avatar" viewBox="0 0 147 147" aria-hidden="true"><rect width="147" height="147" fill="#fff"/><path d="M40 120V62q0-32 33-32t33 32v58q-8-8-16 0t-17 0-17 0-16 0z" fill="#b5dce5" stroke="#fff" stroke-width="5"/><ellipse cx="88" cy="54" rx="16" ry="11" fill="#2b3a44"/><ellipse cx="90" cy="51" rx="6" ry="3" fill="#8fb8c4"/></svg>
      <svg class="thumb" viewBox="0 0 84 84" aria-hidden="true"><path d="M22 40h14v40H22z" fill="#f5b423"/><path d="M36 40l10-22q6-8 10 0l-2 18h18q6 0 4 8l-6 30q-2 6-10 6H36z" fill="#f5b423" stroke="#000" stroke-width="2"/></svg>
      <p class="level">Luna<br>Lvl 20</p>
      <button class="feed-btn" type="button">Feed</button>
      <span class="xp">0/10</span>
    </div>
  </header>

  <!-- Left column -->
  <h2 class="title" style="left:50px;top:283px">Add New Category</h2>
  <h2 class="title" style="left:50px;top:371px">Category Name*</h2>
  <input class="field field--line" style="left:50px;top:427px;padding-left:20px" value="Category name" aria-label="Category name">
  <h2 class="title" style="left:50px;top:564px">Category Details</h2>
  <textarea class="field field--area field--filled" style="left:50px;top:630px;width:630px;height:356px;padding:10px 5px" aria-label="Category details">Detail
detail
lots of detail</textarea>

  <!-- Right column -->
  <h2 class="title" style="left:804px;top:309px">Select Notes</h2>
  <details class="dropdown dropdown--lg" style="left:804px;top:368px">
    <summary>Select Notes</summary>
    <ul>
      <li><label><input type="checkbox" checked> Note 1</label></li>
      <li><label><input type="checkbox"> Note 2</label></li>
      <li><label><input type="checkbox"> Note 3</label></li>
    </ul>
  </details>
  <button class="add-btn add-btn--sm" type="button" style="left:805px;top:468px" onclick="location.href='add-note.html'">
    <svg class="add-icon" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1fe21f"/><path d="M17 8v18M8 17h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    <span>Add New Note</span>
  </button>

  <button class="finish is-on" type="button" style="left:804px;top:727px" onclick="location.href='add-category-note-complete.html'">Finish Adding Category</button>

</main>
</body>
</html>
